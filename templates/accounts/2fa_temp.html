<!-- templates/accounts/2fa_temp.html - Template temporaire -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ message }} - GalSecVote</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .temp-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            padding: 3rem 2rem;
        }
        
        .brand-logo {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 2rem;
        }
        
        .btn-custom {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            color: white;
            text-decoration: none;
            display: inline-block;
            margin: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .btn-custom:hover {
            background: linear-gradient(45deg, #5a6fd8, #6a3d91);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="temp-card">
                    <!-- Logo -->
                    <div class="brand-logo">
                        <i class="fas fa-vote-yea"></i>
                        <span class="ms-2">GalSecVote</span>
                    </div>
                    
                    <!-- Icône -->
                    <div class="mb-4">
                        <i class="fas fa-cogs fa-4x text-warning"></i>
                    </div>
                    
                    <!-- Message -->
                    <h2 class="h3 mb-3 text-dark">{{ message }}</h2>
                    <p class="text-muted mb-4">Cette fonctionnalité sera bientôt disponible.</p>
                    
                    <!-- Messages Django -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                    
                    <!-- Actions -->
                    <div class="mt-4">
                        <a href="{% url 'vote:elections_list' %}" class="btn-custom">
                            <i class="fas fa-vote-yea me-2"></i>Voir les élections
                        </a>
                        
                        <a href="{% url 'accounts:profile' %}" class="btn-custom">
                            <i class="fas fa-user me-2"></i>Mon profil
                        </a>
                        
                        <button onclick="history.back()" class="btn-custom">
                            <i class="fas fa-arrow-left me-2"></i>Retour
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
